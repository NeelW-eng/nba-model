name: Tip-Off Edge run

# Primary clock: Claude scheduled tasks push requests/run (containing the mode), which starts this workflow.
#   am       morning: retrain models, grade last night, post the day's picks
#   pretip   about an hour before the first tip: rescore with the latest injury news (reuses models)
# The cron entry is a late backup for the morning run; it does nothing if today's board already exists.
on:
  schedule:
    - cron: '47 16 * * *'   # ~11:47 AM Central (backup)
  workflow_dispatch:
    inputs:
      mode:
        description: 'am or pretip'
        default: 'pretip'
  push:
    branches: [main]
    paths: ['requests/**', 'pipeline/**', '.github/workflows/**', 'requirements.txt']

permissions:
  contents: write

concurrency:
  group: tipoff-edge
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore models
        uses: actions/cache@v4
        with:
          path: data/models.pkl
          key: models-${{ github.run_id }}
          restore-keys: models-

      - name: Decide mode
        id: mode
        run: |
          MODE=pretip
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ github.event.inputs.mode }}"; fi
          if [ "${{ github.event_name }}" = "push" ] && [ -f requests/run ]; then MODE=$(tr -d '[:space:]' < requests/run); fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE=am
            FRESH=$(python -c "import json,datetime as d;b=json.load(open('data/board.json'));g=d.datetime.fromisoformat(b['generated']);print(int((d.datetime.now(d.timezone.utc)-g).total_seconds()<6*3600))" 2>/dev/null || echo 0)
            if [ "$FRESH" = "1" ]; then MODE=skip; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "mode: $MODE"

      - name: Run pipeline
        if: steps.mode.outputs.mode != 'skip'
        run: python pipeline/run.py ${{ steps.mode.outputs.mode }}

      - name: Commit results
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git config user.name "tipoff-bot"
          git config user.email "tipoff-bot@users.noreply.github.com"
          git add data/board.json data/picks_log.csv data/box_current.parquet data/injuries.json site/tipoff_edge.html
          git commit -m "Update (${{ steps.mode.outputs.mode }}) $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "nothing to commit"
          git pull --rebase origin main && git push
